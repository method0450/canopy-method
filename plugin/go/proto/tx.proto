syntax = "proto3";
package types;
// CORRECT module path matching go.mod: module github.com/method0450/canopy-method/plugin/go
option go_package = "github.com/method0450/canopy-method/plugin/go/contract";

import "google/protobuf/any.proto";

// Transaction represents a request or action submitted to the network
// THIS MUST MATCH lib.Transaction EXACTLY for signing
message Transaction {
  string              message_type   = 1;  // @gotags: json:"messageType"
  google.protobuf.Any msg            = 2;
  Signature           signature      = 3;
  uint64              created_height = 4;  // @gotags: json:"createdHeight"
  uint64              time           = 5;
  uint64              fee            = 6;
  string              memo           = 7;
  uint64              network_id     = 8;  // @gotags: json:"networkID"
  uint64              chain_id       = 9;  // @gotags: json:"chainID"
  // NO CONFLICT STARTING AT FIELD = 10
}

// Signature is a BLS12-381 digital signature
message Signature {
  bytes public_key = 1;  // @gotags: json:"publicKey"
  bytes signature  = 2;
}

// ─── Native Send (unchanged from template) ───────────────────────────────────

message MessageSend {
  bytes  from_address = 1;  // @gotags: json:"fromAddress"
  bytes  to_address   = 2;  // @gotags: json:"toAddress"
  uint64 amount       = 3;
}

// ─── FeeParams — extended from template ──────────────────────────────────────
// Field 1 (send_fee) preserved exactly. Subex fees use fields 2–8.
// NO CONFLICT STARTING AT FIELD = 14 (per template convention)

message FeeParams {
  uint64 send_fee            = 1;  // @gotags: json:"sendFee"
  uint64 create_plan_fee     = 2;  // @gotags: json:"createPlanFee"
  uint64 subscribe_fee       = 3;  // @gotags: json:"subscribeFee"
  uint64 process_billing_fee = 4;  // @gotags: json:"processBillingFee"
  uint64 cancel_fee          = 5;  // @gotags: json:"cancelFee"
  uint64 update_plan_fee     = 6;  // @gotags: json:"updatePlanFee"
  uint64 pause_fee           = 7;  // @gotags: json:"pauseFee"
  // NO CONFLICT STARTING AT FIELD = 14
}

// ─── Subex Transaction Messages ───────────────────────────────────────────────

// Create a subscription plan / tier
message MessageCreatePlan {
  bytes  creator_address  = 1;  // must be exactly 20 bytes — @gotags: json:"creatorAddress"
  string name             = 2;  // max 64 chars
  string description      = 3;  // max 280 chars
  uint64 price            = 4;  // uSBX per billing cycle
  uint64 interval_days    = 5;  // billing cadence in days (e.g. 30) — @gotags: json:"intervalDays"
  uint64 trial_days       = 6;  // 0 = no trial — @gotags: json:"trialDays"
  uint64 max_subscribers  = 7;  // 0 = unlimited — @gotags: json:"maxSubscribers"
}

// Subscribe to a plan
message MessageSubscribe {
  bytes  subscriber_address = 1;  // 20 bytes — @gotags: json:"subscriberAddress"
  uint64 plan_id            = 2;  // @gotags: json:"planId"
}

// Process a billing cycle for a subscription (called by validators / automation)
message MessageProcessBilling {
  bytes  processor_address = 1;  // 20 bytes — earns billing reward — @gotags: json:"processorAddress"
  uint64 subscription_id   = 2;  // @gotags: json:"subscriptionId"
}

// Cancel a subscription
message MessageCancelSubscription {
  bytes  subscriber_address = 1;  // 20 bytes — must match sub owner — @gotags: json:"subscriberAddress"
  uint64 subscription_id    = 2;  // @gotags: json:"subscriptionId"
}

// Pause a subscription — billing frozen, access retained until period ends
message MessagePauseSubscription {
  bytes  subscriber_address = 1;  // @gotags: json:"subscriberAddress"
  uint64 subscription_id    = 2;  // @gotags: json:"subscriptionId"
}

// Resume a paused subscription
message MessageResumeSubscription {
  bytes  subscriber_address = 1;  // @gotags: json:"subscriberAddress"
  uint64 subscription_id    = 2;  // @gotags: json:"subscriptionId"
}

// Update a plan (creator only)
message MessageUpdatePlan {
  bytes  creator_address = 1;  // 20 bytes — must match plan creator — @gotags: json:"creatorAddress"
  uint64 plan_id         = 2;  // @gotags: json:"planId"
  string name            = 3;  // empty = no change
  string description     = 4;  // empty = no change
  uint64 new_price       = 5;  // 0 = no change — @gotags: json:"newPrice"
  uint64 max_subscribers = 6;  // 0 = no change — @gotags: json:"maxSubscribers"
}

// ─── State Objects ────────────────────────────────────────────────────────────

message Plan {
  uint64 id               = 1;
  bytes  creator_address  = 2;   // @gotags: json:"creatorAddress"
  string name             = 3;
  string description      = 4;
  uint64 price            = 5;
  uint64 interval_days    = 6;   // @gotags: json:"intervalDays"
  uint64 trial_days       = 7;   // @gotags: json:"trialDays"
  uint64 max_subscribers  = 8;   // @gotags: json:"maxSubscribers"
  uint64 active_subs      = 9;   // @gotags: json:"activeSubs"
  uint64 created_height   = 10;  // @gotags: json:"createdHeight"
  bool   active           = 11;
}

message Subscription {
  uint64 id                  = 1;
  uint64 plan_id             = 2;   // @gotags: json:"planId"
  bytes  subscriber_address  = 3;   // @gotags: json:"subscriberAddress"
  bytes  plan_creator        = 4;   // @gotags: json:"planCreator"
  uint64 started_height      = 5;   // @gotags: json:"startedHeight"
  uint64 next_billing_height = 6;   // @gotags: json:"nextBillingHeight"
  uint64 trial_ends_height   = 7;   // 0 if no trial — @gotags: json:"trialEndsHeight"
  string status              = 8;   // active | paused | cancelled | trial | failed
  uint64 billing_cycle       = 9;   // @gotags: json:"billingCycle"
  uint64 last_billed_height  = 10;  // @gotags: json:"lastBilledHeight"
}

message PlanCounter {
  uint64 count = 1;
}

message SubCounter {
  uint64 count = 1;
}

// ─── Account / Pool (from template — kept for completeness) ──────────────────
